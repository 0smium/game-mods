name: Build and regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test.py
  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies and build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: smtvv-camera-binaries
          path: |
            build/Release/SMTVVCameraRuntime.dll
            build/Release/SMTVVFirstPerson.asi
            build/Release/SMTVVGardenFreecam.asi
